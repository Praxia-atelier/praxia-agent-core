name: Bug report
description: Something in the runtime does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, real emails, customer data or production logs.
        Reproduce with the mock provider and fictional data whenever possible.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short snippet or steps, ideally using MockProvider.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: '24.x'
