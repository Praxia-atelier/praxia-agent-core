name: Provider request
description: Ask for a new model provider adapter.
labels: [provider]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Public API documentation link
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Authentication method, JSON mode support, anything unusual.
