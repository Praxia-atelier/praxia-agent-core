# Repository labels. Apply once with the GitHub UI or `gh label create`.
- name: bug
  color: d73a4a
  description: Something does not work as documented
- name: enhancement
  color: a2eeef
  description: Improvement to the core
- name: provider
  color: 5319e7
  description: Model provider adapters
- name: connector
  color: 0e8a16
  description: Tool or context connectors
- name: example
  color: fbca04
  description: Runnable examples
- name: docs
  color: 0075ca
  description: Documentation
- name: good first issue
  color: 7057ff
  description: Small, well-scoped, good for newcomers
- name: help wanted
  color: 008672
  description: Maintainers would welcome a contribution
